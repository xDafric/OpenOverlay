services:
  db:
    image: postgres
    env_file:
      - .env
    environment:
      - PGDATA=/data/postgres
    volumes:
      - db:/data/postgres
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3001:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "80:80"

volumes:
  db:
